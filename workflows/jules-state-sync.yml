name: Jules State Sync

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write  # start Jules Dispatch after /jules retry

jobs:
  sync:
    name: Sync Jules issue state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mkshp-dev/julesops@v0.5.0
        with:
          mode: sync
          dispatch-workflow: jules-dispatch.yml
