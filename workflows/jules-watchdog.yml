name: Jules Watchdog

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  watchdog:
    name: Check stale Jules issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: mkshp-dev/julesops@v0.6.0
        with:
          mode: watchdog
