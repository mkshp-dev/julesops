name: Jules Dispatch

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Serialize dispatch runs (schedule, manual, and retry-triggered) so two runs
# can never select and invoke the same queued issue concurrently.
concurrency:
  group: julesops-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch next Jules issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: mkshp-dev/julesops@v0.5.0
        with:
          mode: dispatch
          jules-api-key: ${{ secrets.JULES_API_KEY }}
