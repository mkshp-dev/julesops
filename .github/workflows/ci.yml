name: JulesOps Kit CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-kit:
    name: Validate kit and installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint kit scripts
        run: |
          shellcheck -x -P scripts scripts/*.sh scripts/lib/common.sh
          shellcheck -x -P src src/*.sh

      - name: Validate source kit
        run: scripts/validate-kit.sh

      - name: Run fixture smoke test
        run: scripts/test-fixture.sh

      - name: Run retry command parser tests
        run: node scripts/__tests__/comment-command.test.js

  workflow-logic-tests:
    name: Workflow logic integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run workflow logic tests
        run: scripts/test-workflow-logic.sh

      - name: Run action script tests
        run: scripts/test-action.sh

  action-dry-run:
    name: Run the action on a real runner (dry run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # This repository has no .github/julesops.yml, so these also cover the defaults path.
      - name: Dispatch (dry run)
        id: dispatch
        uses: ./
        with:
          mode: dispatch
          dry-run: 'true'

      - name: Watchdog (dry run)
        uses: ./
        with:
          mode: watchdog
          dry-run: 'true'

      - name: Sync from this pull request event (dry run)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          dry-run: 'true'

      - name: Check action outputs
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: test "$MODE" = "dispatch"

  validate-server:
    name: Validate hosted server skeleton
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start server and run smoke test
        working-directory: server
        env:
          GITHUB_WEBHOOK_SECRET: ci-secret
        run: |
          node src/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          npm run smoke
